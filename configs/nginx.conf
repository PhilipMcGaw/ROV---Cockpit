server {
  # Listen on port 80
  listen 80 default_server;
  listen [::]:80 default_server;

  # Enable gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Proxy requests to the Cockpit application
  location ^~ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serve and cache static files. Versioned asset URLs are used by Cockpit
  # when browser caches must be invalidated after a frontend change.
  location ^~ /static/ {
    alias /home/pi/ROV/Cockpit/static/;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # Proxy camera streams to their respective ports
  location /cam1 {
    proxy_pass http://127.0.0.1:8001;
  }

  location /cam2 {
    proxy_pass http://127.0.0.1:8002;
  }
}
